<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Negotiated Rashomon Reconciliation</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #f4efe7;
      --panel: rgba(255, 253, 249, .74);
      --ink: #2d271f;
      --muted: #796b58;
      --line: #ddd5c9;
      --soft-line: #ebe3d8;
      --paper: #f4efe7;
      --paper-card: rgba(255, 253, 249, .74);
      --brown: #49351d;
      --blue: #56718f;
      --orange: #b06e36;
      --green: #52785e;
      --proxy: #f19647;
      --proxy-bg: #fff1e6;
      --proxy-border: #f6bb83;
      --purple: #49351d;
      --red: #a24a42;
      --font-ui: Arial, Helvetica, sans-serif;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--ink);
      font-family: var(--font-ui);
    }
    main { width: min(1500px, calc(100vw - 96px)); margin: 30px auto 44px; }
    h1 { margin: 0 0 18px; font-size: 26px; font-weight: 780; }
    .toolbar {
      display: grid;
      grid-template-columns: minmax(180px, 260px) minmax(180px, 260px) 1fr;
      gap: 14px;
      align-items: end;
      background: var(--paper-card);
      border: 1.5px solid var(--line);
      border-radius: 18px;
      padding: 16px 18px;
    }
    #topToolbar { display: none !important; }
    /* Study-condition switcher. Fixed to the viewport so it survives every
       stage, and muted so it never reads as part of the participant's task. */
    .condition-switcher { align-items: center; background: rgba(255, 255, 255, .92); border: 1px solid #d4e0ea; border-radius: 999px; display: flex; gap: 6px; right: 12px; padding: 4px 10px 4px 12px; position: fixed; top: 12px; z-index: 1; }
    .condition-switcher label { color: var(--muted); font-size: 10px; font-weight: 800; letter-spacing: .06em; text-transform: uppercase; }
    .condition-switcher select { appearance: auto; background: transparent; border: 0; color: var(--ink); cursor: pointer; font-family: inherit; font-size: 12px; font-weight: 750; padding: 2px 0; }
    .condition-switcher select:focus-visible { outline: 2px solid var(--blue); outline-offset: 2px; }
    @media (max-width: 900px) { .condition-switcher { left: 8px; top: 8px; } }
    label { display: block; margin-bottom: 6px; color: var(--muted); font-size: 13px; font-weight: 650; }
    select { width: 100%; }
    select {
      height: 38px;
      border: 1.5px solid #d8cfbf;
      border-radius: 10px;
      background: rgba(255, 253, 249, .86);
      color: var(--ink);
      font-size: 14px;
      padding: 0 10px;
    }
    button {
      border: 1.5px solid #d8cfbf;
      border-radius: 12px;
      background: rgba(255, 253, 249, .86);
      color: var(--ink);
      cursor: pointer;
      font-weight: 750;
      padding: 8px 10px;
    }
    button:hover { border-color: var(--brown); color: var(--brown); }
    .primary-button { background: var(--brown); border-color: var(--brown); color: #fff; }
    .primary-button:hover { background: var(--brown); color: #fff; }
    .chevron { border-color: currentColor; border-style: solid; border-width: 0 2px 2px 0; display: inline-block; height: .52em; margin: 0 .12em; transform: rotate(-45deg); vertical-align: .02em; width: .52em; }
    .chevron.left { transform: rotate(135deg); }
    .chevron.right { transform: rotate(-45deg); }
    .hint, .panel-note { color: var(--muted); font-size: 13px; line-height: 1.35; }
    .hint { padding-bottom: 2px; }
    .panel-note { margin: -4px 0 14px; }
    .wizard-panel { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; margin-top: 16px; padding: 18px; }
    body.reconcile-mode main { width: min(1500px, calc(100vw - 120px)); }
    body.reconcile-mode { background: var(--paper); }
    .wizard-panel.persona-mode,
    .wizard-panel.elicitation-mode {
      background: #f4efe7;
      border: 0;
      border-radius: 0;
      box-shadow: 0 -8px 0 #282725;
      margin: -24px calc(50% - 50vw) 0;
      min-height: 100vh;
      padding: 34px max(72px, calc((100vw - 1120px) / 2)) 42px;
    }
    .wizard-panel.persona-mode .wizard-topline,
    .wizard-panel.elicitation-mode .wizard-topline { display: none; }
    .wizard-topline { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 14px; }
    .wizard-kicker { color: var(--muted); font-size: 11px; font-weight: 850; letter-spacing: 0; text-transform: none; }
    .wizard-title { font-size: 22px; font-weight: 850; line-height: 1.2; margin-top: 4px; }
    .wizard-subtitle { color: var(--muted); font-size: 14px; line-height: 1.45; margin-top: 6px; max-width: 860px; }
    .wizard-progress { display: inline-flex; align-items: center; border: 1px solid var(--line); border-radius: 999px; color: var(--muted); font-size: 12px; font-weight: 800; padding: 5px 10px; white-space: nowrap; }
    .wizard-body { display: grid; grid-template-columns: minmax(280px, 420px) 1fr; gap: 18px; align-items: start; }
    .wizard-card { border: 1px solid var(--line); border-radius: 8px; background: #fbfcfd; padding: 14px; }
    .wizard-actions { display: flex; flex-wrap: wrap; gap: 8px; justify-content: flex-end; margin-top: 16px; }
    .persona-intro { color: #2d271f; display: grid; gap: 26px; margin: 0 auto; max-width: 1040px; }
    .persona-hero { max-width: 860px; }
    .persona-hero-title {
      font-family: var(--font-ui);
      font-size: clamp(24px, 4.8vw, 32px);
      font-weight: 800;
      letter-spacing: 0;
      line-height: .98;
      margin: 0 0 26px;
    }
    .persona-hero-title em { font-style: italic; font-weight: 500; }
    .persona-hero-copy { color: #796b58; font-size: clamp(15px, 1.6vw, 18px); font-weight: 650; line-height: 1.45; margin: 0; }
    .persona-reading-card {
      background: rgba(255, 253, 249, .72);
      border: 2px solid #ddd5c9;
      border-radius: 24px;
      margin-top: 20px;
      padding: clamp(26px, 3.5vw, 42px);
    }
    .persona-reading-title {
      font-family: var(--font-ui);
      font-size: clamp(20px, 3vw, 24px);
      font-weight: 800;
      line-height: 1.15;
      margin: 0 0 28px;
      text-align: center;
    }
    .persona-reading-copy { display: grid; gap: 18px; margin: 0 auto; max-width: 1100px; }
    .persona-reading-copy p { font-size: clamp(15px, 1.7vw, 18px); line-height: 1.55; margin: 0; }
    .persona-reading-copy strong { font-weight: 850; }
    .persona-meta-row { align-items: center; color: #796b58; display: flex; flex-wrap: wrap; gap: 38px; font-size: 22px; font-weight: 700; margin: 2px 8px 0; }
    .persona-meta-item { align-items: center; display: inline-flex; gap: 10px; }
    .persona-meta-icon { color: #796b58; height: 24px; width: 24px; }
    .persona-consent-card {
      background: rgba(255, 253, 249, .72);
      border: 2px solid #ddd5c9;
      border-radius: 24px;
      display: grid;
      gap: 28px;
      padding: clamp(22px, 3vw, 34px) clamp(24px, 3vw, 38px);
    }
    .persona-consent-row {
      align-items: start;
      color: #2d271f;
      cursor: pointer;
      display: grid;
      font-size: clamp(15px, 1.6vw, 18px);
      font-weight: 800;
      gap: 22px;
      grid-template-columns: 42px 1fr;
      line-height: 1.45;
      margin: 0;
    }
    .persona-consent-row input {
      appearance: none;
      background: #f7f1ea;
      border: 2px solid #d9d0c3;
      border-radius: 8px;
      cursor: pointer;
      height: 38px;
      margin: 2px 0 0;
      width: 38px;
    }
    .persona-consent-row input:checked {
      background: #2d271f;
      border-color: #2d271f;
      box-shadow: inset 0 0 0 8px #f7f1ea;
    }
    .persona-begin-button {
      align-items: center;
      background: #2d271f;
      border: 0;
      border-radius: 18px;
      color: #fff;
      display: inline-flex;
      font-size: clamp(17px, 1.8vw, 22px);
      gap: 18px;
      justify-content: center;
      min-height: 64px;
      width: 100%;
    }
    .persona-begin-button:hover { background: #2d271f; color: #fff; }
    .persona-begin-button:disabled {
      background: #b8b0a5;
      color: #fff;
      cursor: not-allowed;
    }
    .persona-contact { color: #796b58; font-size: clamp(18px, 1.8vw, 24px); font-weight: 650; line-height: 1.25; margin: 18px auto 0; max-width: 720px; text-align: center; }
    .persona-contact a { color: inherit; text-decoration-thickness: 1px; text-underline-offset: 4px; }
    .pairwise-page { color: #2d271f; display: grid; gap: 22px; margin: 0 auto; max-width: 1080px; width: 100%; }
    .pairwise-page.review-mode { max-width: 920px; margin: 0 auto; width: 100%; }
    .pairwise-title { font-family: var(--font-ui); font-size: clamp(24px, 4.2vw, 32px); font-weight: 850; letter-spacing: 0; line-height: 1.02; margin: 0; }
    .pairwise-title em { display: block; font-style: italic; font-weight: 500; }
    .pairwise-subtitle { color: #796b58; font-size: clamp(16px, 1.7vw, 21px); font-weight: 650; line-height: 1.45; margin: 18px 0 0;}
    .pairwise-card { background: rgba(255, 253, 249, .72); border: 2px solid #ddd5c9; border-radius: 24px; padding: clamp(26px, 3.2vw, 40px); }
    .pairwise-card.ranking-card, .pairwise-card.review-card { background: transparent; border: 0; border-radius: 0; padding: 0; }
    .ranking-list { display: grid; gap: 12px; }
    .ranking-row { align-items: center; background: rgba(255, 253, 249, .72); border: 2px solid #ddd5c9; border-radius: 18px; cursor: grab; display: grid; grid-template-columns: 28px 48px 1fr auto; gap: 16px; min-height: 88px; padding: 16px 28px; }
    .ranking-row.dragging { opacity: .45; }
    .ranking-row:active { cursor: grabbing; }
    .ranking-grip { color: #8a7d68; font-size: 20px; letter-spacing: 1px; line-height: .6; white-space: pre-line; }
    .ranking-index { align-items: center; background: #49351d; border-radius: 999px; color: #fff; display: inline-flex; font-size: 18px; font-weight: 850; height: 42px; justify-content: center; width: 42px; }
    .ranking-name { font-family: var(--font-ui); font-size: 21px; font-weight: 850; line-height: 1.1; }
    .ranking-desc { color: #796b58; font-size: 16px; font-weight: 650; line-height: 1.25; margin-top: 6px; }
    .ranking-pill { background: #f0e9dc; border-radius: 999px; color: #c0a062; font-size: 15px; font-weight: 850; padding: 6px 14px; white-space: nowrap; }
    .pair-cards { align-items: center; display: grid; grid-template-columns: 1fr auto 1fr; gap: 22px; margin-bottom: 38px; }
    .criterion-card { background: #e9dfce; border-radius: 18px; min-height: 126px; padding: 22px 22px; text-align: center; }
    .criterion-rank { color: #796b58; font-size: 15px; font-weight: 800; }
    .criterion-name { font-family: var(--font-ui); font-size: clamp(22px, 2.4vw, 28px); font-weight: 850; margin-top: 14px; }
    .criterion-description { color: #796b58; font-size: clamp(14px, 1.5vw, 17px); font-weight: 650; line-height: 1.25; margin-top: 14px; }
    .pair-versus { color: #796b58; font-size: 24px; font-weight: 850; }
    .pair-question { font-size: clamp(18px, 2vw, 23px); font-weight: 650; line-height: 1.35; margin: 0 0 34px; text-align: center; }
    .intensity-options { display: grid; gap: 14px; }
    .intensity-option { align-items: center; border: 1.5px solid #ddd5c9; border-radius: 14px; cursor: pointer; display: grid; font-size: clamp(16px, 1.7vw, 21px); font-weight: 850; gap: 20px; grid-template-columns: 36px 1fr; padding: 15px 24px; }
    .intensity-option input { appearance: none; border: 3px solid #81745f; border-radius: 50%; height: 24px; margin: 0; width: 24px; }
    .intensity-option:has(input:checked) { background: #e9dfce; border-color: #2d271f; box-shadow: 0 0 0 3px rgba(45, 39, 31, .25); }
    .intensity-option input:checked { background: #81745f; box-shadow: inset 0 0 0 7px #e9dfce; }
    .pairwise-nav { align-items: center; color: #796b58; display: grid; grid-template-columns: 1fr auto 1fr; font-size: 17px; font-weight: 850; margin-top: 16px; }
    .pairwise-nav button { background: transparent; border: 0; color: #796b58; font-size: inherit; padding: 8px; text-align:left}
    .pairwise-nav button:disabled { color: #d0c8bc; cursor: not-allowed; }
    .pairwise-nav button:last-child { justify-self: end; }
    .pairwise-counter { justify-self: center; }
    .rerank-button { align-items: center; background: transparent; border: 0; color: #796b58; display: inline-flex; font-size: 16px; font-weight: 850; justify-content: center; margin: 18px auto 0; padding: 8px 10px; }
    .rerank-button:hover { color: #49351d; }
    .pairwise-submit { align-items: center; background: #49351d; border: 0; border-radius: 18px; color: #fff; display: inline-flex; font-size: clamp(17px, 1.8vw, 22px); gap: 18px; justify-content: center; min-height: 64px; width: 100%; }
    .pairwise-submit:hover, .pairwise-submit:focus-visible { background: #49351d; border-color: #49351d; color: #fff; }
    .pairwise-submit:disabled { background: #b8b0a5; color: #fff; cursor: not-allowed; }
    .computed-card { background: rgba(255, 253, 249, .72); border: 1.5px solid #ddd5c9; border-radius: 24px; padding: 32px 42px; }
    .computed-list { display: grid; gap: 20px; }
    .computed-row { display: grid; grid-template-columns: 24px 1fr 56px; gap: 18px; align-items: start; }
    .computed-rank { color: #796b58; font-size: 17px; font-weight: 750; text-align: right; }
    .computed-name { font-family: var(--font-ui); font-size: 20px; font-weight: 850; }
    .computed-desc { color: #796b58; font-family: var(--font-ui); font-size: 16px; font-weight: 650; margin-left: 8px; }
    .computed-pct { font-size: 20px; font-weight: 850; text-align: right; }
    .computed-track { background: #e7decf; border-radius: 999px; grid-column: 2 / 4; height: 10px; overflow: hidden; }
    .computed-fill { background: #49351d; border-radius: 999px; height: 100%; min-width: 2px; }
    .computed-note { border-top: 1px solid #ddd5c9; color: #796b58; font-size: 16px; font-weight: 700; line-height: 1.4; margin: 28px 0 0; padding-top: 22px; }
    .review-actions { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 16px; margin-top: 14px; }
    .review-button { align-items: center; border-radius: 16px; display: inline-flex; font-size: 18px; font-weight: 850; justify-content: center; min-height: 58px; }
    .review-button.secondary { background: rgba(255, 253, 249, .72); border: 1.5px solid #ddd5c9; color: #2d271f; }
    .review-button.primary { background: #49351d; border-color: #49351d; color: #fff; }
    .review-button.primary:hover { background: #49351d; color: #fff; }
    .weight-preview { display: grid; gap: 7px; margin-top: 10px; }
    .weight-preview-row { display: grid; grid-template-columns: 142px 1fr 44px; gap: 8px; align-items: center; font-size: 12px; }
    .calibration-card { display: grid; gap: 14px; }
    .calibration-case { background: rgba(255, 253, 249, .72); border: 2px solid #ddd5c9; border-radius: 18px; display: grid; gap: 12px; padding: 18px; }
    .calibration-case-title { font-family: var(--font-ui); font-size: 20px; font-weight: 850; line-height: 1.1; }
    .calibration-case-meta { color: #796b58; font-size: 13px; font-weight: 800; line-height: 1.35; }
    .calibration-choice-grid, .calibration-acceptance { display: grid; gap: 8px; grid-template-columns: repeat(4, minmax(0, 1fr)); }
    .calibration-acceptance { grid-template-columns: repeat(3, minmax(0, 1fr)); }
    .calibration-choice-grid label, .calibration-acceptance label { align-items: center; background: rgba(255, 253, 249, .86); border: 1.5px solid #ddd5c9; border-radius: 12px; color: var(--muted); cursor: pointer; display: flex; font-size: 13px; font-weight: 850; gap: 8px; justify-content: center; min-height: 42px; padding: 8px; text-align: center; }
    .calibration-choice-grid label:has(input:checked), .calibration-acceptance label:has(input:checked) { background: var(--brown); border-color: var(--brown); color: #fff; }
    .calibration-choice-grid input, .calibration-acceptance input { appearance: none; height: 0; margin: 0; position: absolute; width: 0; }
    .calibration-fit-note { color: #796b58; font-size: 13px; font-weight: 750; line-height: 1.4; }
    .cmp-layout { align-items: start; display: grid; gap: 16px; grid-template-columns: minmax(0, 1fr) 240px; }
    .cmp-main { display: grid; gap: 10px; min-width: 0; }
    .cmp-questions { display: grid; gap: 14px; }
    .cmp-questions .calibration-case-meta { margin-bottom: 6px; }
    .cmp-questions .calibration-choice-grid, .cmp-questions .calibration-acceptance { grid-template-columns: 1fr; }
    .cmp-questions .calibration-choice-grid label, .cmp-questions .calibration-acceptance label { justify-content: flex-start; min-height: 38px; }
    .cmp-chart { display: grid; gap: 8px; }
    .cmp-legend { align-items: center; color: var(--muted); display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: 11px; font-weight: 800; }
    .cmp-legend .cmp-key { align-items: center; display: inline-flex; gap: 5px; }
    .cmp-cols { display: grid; gap: 8px; grid-template-columns: 1fr; }
    .cmp-col { background: rgba(255, 253, 249, .86); border: 1.5px solid #ddd5c9; border-radius: 14px; display: grid; gap: 6px; padding: 12px 14px; }
    .cmp-col-head { align-items: center; color: var(--ink); display: flex; font-size: 13px; font-weight: 850; gap: 7px; padding-bottom: 4px; }
    .cmp-col-label { color: var(--ink); font-size: 11px; font-weight: 800; line-height: 1.1; }
    .cmp-row { align-items: center; display: grid; gap: 8px; grid-template-columns: minmax(70px, .8fr) minmax(0, 1.4fr) 60px; }
    .cmp-tag { font-size: 11px; font-weight: 900; text-align: center; }
    .cmp-tag.a { color: #9a6a3a; }
    .cmp-tag.b { color: #537791; }
    .cmp-track { background: #ece2d5; border: 1px solid #ded2c2; border-radius: 6px; height: 15px; overflow: visible; position: relative; }
    .cmp-fill { border-radius: 6px 0 0 6px; bottom: 0; left: 0; position: absolute; top: 0; }
    .cmp-fill.a { background: rgba(154, 106, 58, .78); }
    .cmp-fill.b { background: rgba(83, 119, 145, .8); }
    .cmp-err { background: rgba(45, 39, 31, .6); height: 2px; position: absolute; top: 50%; transform: translateY(-50%); }
    .cmp-err::before, .cmp-err::after { background: rgba(45, 39, 31, .6); content: ""; height: 8px; position: absolute; top: -3px; width: 2px; }
    .cmp-err::before { left: 0; }
    .cmp-err::after { right: 0; }
    .cmp-val { color: var(--brown); font-size: 12px; font-variant-numeric: tabular-nums; font-weight: 900; text-align: right; }
    .cmp-val .cmp-sd { color: var(--muted); font-size: 10px; font-weight: 800; }
    .cmp-floor { color: #b23b2e; font-weight: 900; margin-left: 3px; }
    @media (max-width: 900px) { .calibration-choice-grid, .calibration-acceptance { grid-template-columns: repeat(2, minmax(0, 1fr)); } .cmp-layout { grid-template-columns: 1fr; } .cmp-questions .calibration-choice-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); } .cmp-questions .calibration-acceptance { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
    .preview-track { height: 10px; background: #edf1f5; border-radius: 999px; overflow: hidden; }
    .preview-fill { height: 100%; background: var(--blue); border-radius: 999px; }
    .reconciliation-shell { color: #2d271f; display: grid; }
    .reconcile-identity-banner { border: 1px solid #b9ceff; border-radius: 8px; color: #245fba; display: grid; font-size: 14px; gap: 3px; justify-self: start; line-height: 1.18; margin: 0; max-width: 760px; padding: 5px 9px; text-align: left; }
    .reconcile-identity-banner strong { font-weight: 850; }
    .reconcile-identity-banner .informed-reminder-other { display: block; line-height: 1.15; max-width: 760px; color: var(--proxy);}
    .reconcile-hero { display: grid; gap: 10px; max-width: 980px; }
    .reconcile-title { font-family: var(--font-ui); font-size: clamp(34px, 4vw, 50px); font-weight: 850; line-height: 1.03; margin: 0; }
    .reconcile-subtitle { color: #796b58; font-size: clamp(15px, 1.5vw, 18px); font-weight: 650; line-height: 1.45; margin: 0; max-width: 860px; }
    .grid { align-items: stretch; display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 18px; margin-top: 4px; }
    body.condition-negotiation .grid { align-items: start; grid-template-columns: 780px minmax(360px, 640px); }
    body.condition-negotiatev2 .grid { align-items: start; grid-template-columns: 620px minmax(360px, 820px); }
    body.condition-single .grid,
    body.condition-singleoptimal .grid,
    body.condition-multioptimal .grid,
    body.condition-exposure .grid,
    body.condition-informed .grid { grid-template-columns: minmax(0, 1fr); }
    body.condition-single .negotiation-panel,
    body.condition-singleoptimal .negotiation-panel,
    body.condition-multioptimal .negotiation-panel,
    body.condition-exposure .negotiation-panel,
    body.condition-informed .negotiation-panel { display: none; }
    body.condition-single .details-popover,
    body.condition-singleoptimal .details-popover { display: none; }
    .grid > .panel, .grid > .left-stack { height: 100%; }
    .left-stack { display: grid; gap: 18px; grid-template-rows: minmax(0, 1fr) auto; min-width: 0; }
    .left-stack > .panel { height: auto; }
    .panel { background: var(--paper-card); border: 1.5px solid var(--line); border-radius: 20px; padding: 18px; min-width: 0; }
    .panel h2 { font-family: var(--font-ui); font-size: 20px; font-weight: 850; line-height: 1.15; margin: 0 0 12px; }

    body.condition-multioptimal .grid { grid-template-columns: minmax(0, 1fr); }
    body.condition-multioptimal .negotiation-panel { display: none; }
    /* Multi conditions read top to bottom -- input case, brace, table -- as one
       grid whose columns are [caption][criteria labels][one per model], so the
       case box and brace stay centred over the model columns and the caption
       sits beside the table. Column widths come from the inline template. */
    .multi-optimal-diagram { align-items: start; justify-content: center; min-width: 0; row-gap: 10px; }
    .multi-optimal-case-box { border: 1px solid rgb(133, 133, 133); justify-self: center; width: max-content; }
    .multi-optimal-case-list { justify-self: center; }
    .multi-optimal-brace { height: 40px; line-height: 0; width: 100%; }
    .multi-optimal-brace svg { height: 100%; width: 100%; }
    .multi-optimal-corner { background: transparent !important; min-height: 0; padding: 0; }
    /* Caption beside the criteria block rather than a heading above it. */
    .multi-optimal-subgroup-heading { align-self: center; font-size: 15px; line-height: 1.3; margin: 0; position: relative; text-align: center; }
    .multi-optimal-group { align-items: center; display: grid; gap: 2px; justify-items: center; position: relative; }
    .multi-optimal-role { align-items: center; color: #111; column-gap: 6px; display: flex; font-size: 15px; font-weight: 900; justify-content: center; row-gap: 3px; }
    .negotiate-v2-model-version-select { appearance: auto; background: #eef3f8; border: 1px solid #c7d7e4; border-radius: 999px; color: #2d4356; cursor: pointer; font-size: 12px; font-weight: 800; width: 40px; height:20px; padding: 0 2px; }
    .negotiate-v2-model-version-select:hover { border-color: #8fb0c7; }
    /* What each side's model predicted, at the foot of its column, with the SHAP
       popover hanging off the "AI Explanation" link below it. */
    .multi-optimal-prediction-cell { align-items: center; display: grid; gap: 3px; justify-items: center; padding-top: 16px; }
    .multi-optimal-prediction-value { color: #111; font-family: Arial, Helvetica, sans-serif; font-size: 20px; font-weight: 900; line-height: 1.15; text-align: center; }
    .multi-optimal-prediction-value.class-0 { color: #3f87df; }
    .multi-optimal-prediction-value.class-1 { color: #ef2b2f; }
    .multi-optimal-detail-wrap { margin-left: 0; position: relative; }
    /* "AI Explanation" is itself the hover trigger for the SHAP popover. */
    .multi-optimal-detail-wrap .model-detail-link { color: var(--blue); cursor: pointer; font-size: 13px; font-weight: 800; text-decoration: underline; text-underline-offset: 3px; white-space: nowrap; }
    .multi-optimal-detail-wrap:hover .model-detail-link,
    .multi-optimal-detail-wrap:focus-within .model-detail-link { color: #3d5573; }
    /* Opens upward from its link and centred on it: the trigger sits at the foot
       of the page, and the stacked layout is too narrow to open sideways. */
    .multi-optimal-table .exposure-shap-popover { bottom: calc(100% + 10px); grid-template-columns: 320px 170px 180px; left: 50%; top: auto; transform: translateX(-50%); }
    .multi-optimal-popover-ai { align-content: start; align-self: start; gap: 0; margin-top: 0; width: 180px; }
    .multi-optimal-popover-ai .single-ai-title { align-items: center; display: flex; height: var(--popover-heading-height); justify-content: center; margin: 0; }
    .multi-optimal-popover-ai .single-ai-box { font-size: 15px; min-width: 130px; padding: 14px 16px; }
    .multi-optimal-summary { display: grid; gap: 16px; grid-template-columns: repeat(2, minmax(0, 1fr)); }

    /* No body.condition-aggregate layout rules: the body carries
       condition-multioptimal as well, so aggregate inherits that condition's
       styling in full. What follows is the importance slider it adds. */
    .aggregate-rec { border-top: 1.5px solid #d8d8d8; display: grid; gap: 9px; margin-top: 10px; padding-top: 10px; }
    .aggregate-rec-row { align-items: center; display: grid; gap: 10px; }
    .aggregate-slider-row { grid-template-columns: minmax(150px, auto) minmax(220px, 1fr) minmax(150px, auto); }
    .aggregate-side { color: #333; font-size: 13px; font-weight: 850; white-space: nowrap; }
    .aggregate-side.self { color: var(--blue); }
    .aggregate-side.other { color: var(--proxy); text-align: right; }
    .aggregate-slider { accent-color: #000; width: 100%; }
    .aggregate-result-row { grid-template-columns: auto auto auto 1fr; justify-content: start; }
    .aggregate-result-label { color: #333; font-size: 13px; font-weight: 900; }
    .aggregate-result { border: 2px solid #000; color: #111; font-size: 15px; font-weight: 950; padding: 3px 9px; }
    .aggregate-result.class-0 { color: #3f87df; }
    .aggregate-result.class-1 { color: #ef2b2f; }
    .aggregate-result-prob, .aggregate-help { color: #555; font-size: 12px; font-weight: 800; }
    .aggregate-help { justify-self: end; }
    /* Tall panel with the composer pinned to its bottom edge; the history fills
       the space above and stacks its messages downward, so a short exchange sits
       just above the composer instead of leaving a band between the two. */
    .chat-window { align-items: stretch; background: rgba(255, 253, 249, .58); border: 1.5px solid var(--line); border-radius: 16px; display: flex; flex-direction: column; gap: 10px; height: 100%; max-height: calc(100vh - 260px); min-height: 620px; overflow: hidden; padding: 12px; }
    body.condition-negotiation .chat-window,
    body.condition-negotiatev2 .chat-window { background: #fff; border: 2px solid #000; border-radius: 0; max-height: calc(100vh - 170px); min-height: 620px; }
    .negotiate-v2-composer .response-config { grid-template-columns: repeat(2, minmax(0, 1fr)) 120px; }
    .negotiate-v2-composer .response-preview { background: #fff; border: 1.5px solid #d4e0ea; border-radius: 10px; color: #222; font-size: 12px; font-weight: 750; line-height: 1.35; margin-top: 7px; padding: 7px 9px; }
    .negotiate-v2-warning { background: #fff5e6; border: 1.5px solid #e6b35c; border-radius: 8px; color: #7a4a00; font-size: 12px; font-weight: 750; line-height: 1.35; margin-top: 7px; padding: 6px 9px; }
    .negotiate-v2-pending { background: #eef6ff; border: 1px solid #7fa8d0; border-radius: 999px; color: #1d3f63; font-size: 11px; font-weight: 750; padding: 1px 8px; white-space: nowrap; }
    /* Detail affordance: the package breakdown and the how-it-works note live
       here so the composer itself shows only the controls and the result. */
    .negotiate-v2-composer .composer-title { align-items: center; display: flex; gap: 6px; justify-content: space-between; }
    .composer-help.nv2-details { border-radius: 999px; flex: none; font-size: 13px; font-weight: 800; height: 18px; letter-spacing: 1px; line-height: 1; padding-bottom: 4px; width: 26px; }
    /* Popover geometry and inner styling live with the restyled composer at the
       bottom of this sheet, so the two cannot drift apart again. */
    /* Provenance of the Other-party wording: language model vs scripted fallback. */
    .nv2-voice { border-radius: 999px; display: inline-block; font-size: 9.5px; font-weight: 800; letter-spacing: 0.04em; margin-left: 6px; padding: 1px 6px; text-transform: uppercase; vertical-align: 1px; cursor: help; }
    .nv2-voice.llm { background: #eaf3ea; border: 1px solid #b6d3b6; color: #3d6b42; }
    .nv2-voice.fallback { background: #f3f0e8; border: 1px solid #d6c9a8; color: #7a6224; }
    .negotiate-v2-composer .response-package { margin-top: 7px; }
    .multi-optimal-version-note { color: #555; font-size: 12px; font-weight: 850; margin: 0 0 8px; text-align: center; }
    /* The composer reads as a single input surface rather than a chat bubble
       from the participant: one quiet white card, the prose it holds set at
       reading size, and every control on the bottom row reduced to a pill or a
       circle so the row scans as a toolbar under the text. */
    .composer { background: transparent; border: 0; display: grid; flex: 0 0 auto; justify-items: stretch; margin-top: auto; padding: 0; }
    .composer.locked { background: transparent; }
    .composer-bubble { background: #fff; border: 1px solid #e4e2dd; border-radius: 18px; box-shadow: none; max-width: 100%; padding: 16px 18px 12px; position: relative; width: 100%; }
    .composer.locked .composer-bubble { background: #faf9f7; border-color: #e8e6e1; }
    .composer-title { align-items: center; color: #1c1b19; display: flex; font-size: 15px; font-weight: 650; gap: 8px; justify-content: space-between; letter-spacing: 0; line-height: 1.45; margin-bottom: 8px; text-transform: none; }
    .composer-speaker { align-items: center; display: inline-flex; gap: 7px; }
    .composer-avatar { align-items: center; background: var(--blue); border-radius: 999px; color: #fff; display: inline-flex; font-size: 9px; font-weight: 900; height: 20px; justify-content: center; width: 20px; }
    .composer-send-row { align-items: center; display: flex; gap: 8px; justify-content: space-between; margin-top: 6px; }
    .composer-send-row .degree-summary { border-top: 0; margin-top: 0; padding-top: 0; }
    .composer-send-row .composer-actions { margin-top: 0; }
    .composer-help { align-items: center; border: 1.5px solid #c7d7e4; border-radius: 50%; color: var(--blue); cursor: help; display: inline-flex; font-size: 10px; height: 18px; justify-content: center; position: relative; width: 18px; }
    .composer-help-text { background: #fbfdff; border: 1.5px solid #c7d7e4; border-radius: 10px; box-shadow: 0 12px 28px rgba(45, 39, 31, .14); color: var(--ink); display: none; font-size: 12px; font-weight: 650; left: 22px; line-height: 1.35; min-width: 230px; padding: 8px 10px; position: absolute; top: -8px; z-index: 30; }
    .composer-help:hover .composer-help-text, .composer-help:focus-within .composer-help-text { display: block; }
    .empty-history { align-items: center; color: #b8afa2; display: flex; font-size: 16px; font-weight: 850; justify-content: center; min-height: 100%; text-align: center; }
    .composer-sliders, .degree-adjustments { background: rgba(234, 241, 246, .54); border: 1px solid #c7d7e4; border-radius: 12px; display: grid; grid-template-columns: minmax(52px, .46fr) repeat(5, minmax(34px, .48fr)) minmax(34px, .34fr); overflow: hidden; }
    .degree-matrix-header, .degree-row-header, .degree-option, .inactive-note, .degree-value-cell { align-items: center; display: flex; min-height: 22px; padding: 2px 4px; }
    .degree-matrix-header { background: #dbe8f1; color: var(--muted); font-size: 9px; font-weight: 850; justify-content: center; line-height: 1; text-align: center; }
    .degree-row-header { align-items: center; background: rgba(255, 253, 249, .56); flex-wrap: wrap; gap: 1px 4px; justify-content: space-between; min-width: 0; }
    .degree-row-header.inactive, .degree-option.inactive, .inactive-note, .degree-value-cell.inactive { background: rgba(238, 243, 247, .58); color: #b8afa2; }
    .inactive-note { grid-column: span 5; justify-content: center; font-size: 9px; font-weight: 750; line-height: 1.05; text-align: center; }
    .degree-value-cell { background: rgba(255, 253, 249, .56); color: var(--muted); font-size: 10px; font-weight: 850; font-variant-numeric: tabular-nums; justify-content: center; }
    .degree-name { font-size: 11px; font-weight: 900; line-height: 1; }
    .degree-preview { color: var(--muted); font-size: 8px; font-variant-numeric: tabular-nums; font-weight: 750; white-space: nowrap; }
    .degree-option { background: rgba(255, 253, 249, .56); cursor: pointer; justify-content: center; position: relative; }
    .degree-option input { appearance: none; background: rgba(255, 253, 249, .9); border: 2px solid #c7d7e4; border-radius: 50%; cursor: pointer; height: 14px; margin: 0; width: 14px; }
    .degree-option input:checked { background: var(--blue); border-color: #c7d7e4; box-shadow: inset 0 0 0 3px rgba(255, 253, 249, .95); }
    .degree-option:has(input:disabled) { cursor: not-allowed; opacity: .58; }
    .degree-summary { color: var(--muted); display: grid; flex: 1; gap: 4px; font-size: 11px; line-height: 1.2; min-width: 0; }
    .composer-row span:last-child { color: var(--muted); font-variant-numeric: tabular-nums; text-align: right; }
    .composer-row input { accent-color: var(--blue); }
    .composer-row input:disabled { cursor: not-allowed; opacity: .55; }
    .composer-actions { display: flex; flex-wrap: wrap; gap: 8px; justify-content: flex-end; margin-top: 8px; }
    .composer-actions .primary-button { font-size: 11px; min-height: 30px; padding: 5px 10px; }
    .foresight-prompt { color: var(--ink); font-size: 12px; font-weight: 750; line-height: 1.25; margin: 2px 0 7px;display: inline;}
    .foresight-list { display: grid; gap: 5px; margin-top: 5px;}
    .foresight-card { align-items: center; background: rgba(255, 253, 249, .72); border: 1px solid #c7d7e4; border-radius: 12px; display: grid; gap: 7px; grid-template-columns: minmax(92px, .7fr) minmax(0, 1.3fr) auto; padding: 5px 7px; }
    .foresight-card.inactive { background: rgba(238, 243, 247, .58); color: #b8afa2; grid-template-columns: minmax(92px, .7fr) minmax(0, 1fr) auto; }
    .foresight-question { align-items: baseline; display: flex; flex-wrap: wrap; gap: 4px 6px; min-width: 0; }
    .foresight-key { color: var(--ink); font-size: 13px; font-weight: 950; line-height: 1; }
    .foresight-card.inactive .foresight-key { color: #b8afa2; }
    .foresight-copy { color: var(--muted); font-size: 10px; font-weight: 800; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .foresight-meta, .foresight-offer { color: var(--muted); font-size: 10px; font-variant-numeric: tabular-nums; font-weight: 850; white-space: nowrap; }
    .foresight-offer { min-width: 34px; text-align: right; }
    .foresight-options { display: flex; gap: 4px; min-width: 0; overflow-x: auto; padding-bottom: 1px; }
    .foresight-chip { align-items: center; background: rgba(255, 253, 249, .88); border: 1.5px solid #c7d7e4; border-radius: 999px; color: var(--muted); cursor: pointer; display: inline-flex; flex: 0 0 auto; font-size: 10px; font-weight: 850; min-height: 22px; padding: 2px 7px; }
    .foresight-chip input { appearance: none; height: 0; margin: 0; position: absolute; width: 0; }
    .foresight-chip:has(input:checked) { background: var(--blue); border-color: var(--blue); color: #fff; }
    .foresight-chip:has(input:disabled) { cursor: not-allowed; opacity: .56; }
    .response-protocol { display: grid; gap: 5px; margin-top: 4px; }
    .response-package { background: rgba(255, 253, 249, .66); border: 1px solid #c7d7e4; border-radius: 8px; display: grid; gap: 4px; grid-template-columns: repeat(3, minmax(0, 1fr)); padding: 5px; }
    .response-package-row { align-items: center; display: grid; gap: 3px; min-height: 18px; }
    .response-package-role { color: var(--muted); font-size: 8px; font-weight: 900; text-transform: none; }
    .response-package-issue { color: var(--ink); font-size: 10px; font-weight: 900; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .response-package-value { color: var(--muted); font-size: 9px; font-variant-numeric: tabular-nums; font-weight: 850; grid-column: 2; line-height: 1; text-align: left; white-space: nowrap; }
    .response-act-grid { display: grid; gap: 4px; grid-template-columns: repeat(5, minmax(0, 1fr)); }
    .opening-act-grid { grid-template-columns: repeat(4, minmax(0, 1fr)); }
    .response-act-chip { align-items: center; background: rgba(255, 253, 249, .86); border: 1.5px solid #c7d7e4; border-radius: 8px; color: var(--muted); cursor: pointer; display: flex; font-size: 9px; font-weight: 900; justify-content: center; line-height: 1.05; min-height: 26px; padding: 3px 5px; text-align: center; }
    .response-act-chip input { appearance: none; height: 0; margin: 0; position: absolute; width: 0; }
    .response-act-chip:has(input:checked) { background: var(--blue); border-color: var(--blue); color: #fff; }
    .response-act-chip:has(input:disabled) { cursor: not-allowed; opacity: .58; }
    .response-config { align-items: end; display: grid; gap: 5px; grid-template-columns: repeat(3, minmax(0, 1fr)); }
    .response-field { display: grid; gap: 2px; min-width: 0; }
    .response-field label { color: var(--muted); font-size: 12px; font-weight: 900; }
    .response-field select { background: rgba(255, 253, 249, .92); border: 1.5px solid #c7d7e4; border-radius: 7px; color: var(--ink); font-size: 10px; font-weight: 800; min-height: 24px; padding: 2px 6px; width: 100%; }
    .response-preview { display: none; }
    .response-preview strong { color: var(--ink); font-size: 10px; }
    .composer-bubble .composer-send-row { align-items: center; margin-top: 5px; }
    .composer-bubble .degree-summary { font-size: 10px; line-height: 1.15; }

    /* --- Composer surface, restyled ------------------------------------- *
       Everything below only changes how the composer looks; the markup it
       styles is unchanged. Prose sits at reading size at the top, and the
       controls collapse into one toolbar row: pills for anything with a label,
       circles for anything that is only an icon, and one filled dark button as
       the single send affordance. */
    .composer-bubble .foresight-prompt { color: #57544e; display: block; font-size: 13px; font-weight: 600; line-height: 1.45; margin: 0 0 10px; }
    .composer-bubble .response-preview,
    .negotiate-v2-composer .response-preview { background: transparent; border: 0; border-radius: 0; color: #1c1b19; font-size: 16px; font-weight: 500; line-height: 1.5; margin: 0 0 12px; padding: 0; }
    .composer-bubble .response-preview strong { color: #1c1b19; font-size: inherit; font-weight: 750; }
    /* Model tags and the pending-offer marker are the composer's inline
       mentions, so they carry the accent colour rather than a boxed chip. */
    .composer-bubble .negotiate-v2-pending { background: #e4f4f1; border: 1px solid #c7e7e1; color: #15706a; font-size: 11px; font-weight: 750; letter-spacing: .01em; padding: 2px 9px; }

    /* The three package selects: label above, pill below, in a quiet grey. */
    .composer-bubble .response-config { align-items: end; gap: 10px; margin-bottom: 12px; }
    .composer-bubble .response-field { gap: 4px; }
    .composer-bubble .response-field label { color: #86827a; font-size: 11px; font-weight: 700; letter-spacing: .01em; }
    .composer-bubble .response-field select { background: #fff; border: 1px solid #e4e2dd; border-radius: 999px; color: #33312d; font-size: 12px; font-weight: 650; min-height: 34px; padding: 4px 12px; }
    .composer-bubble .response-field select:focus-visible { border-color: #b9b5ac; outline: 0; }
    .composer-bubble .response-field select:disabled { background: #f7f6f3; color: #a8a49c; }

    /* Toolbar row. The summary column keeps the buttons pushed right, exactly
       as before -- it just no longer competes with them for attention. */
    .composer-bubble .composer-send-row { border-top: 1px solid #f0eeea; gap: 10px; margin-top: 0; padding-top: 10px; }
    .composer-bubble .degree-summary { color: #8b877f; font-size: 11px; line-height: 1.3; }
    .composer-bubble .composer-actions { align-items: center; flex-wrap: nowrap; gap: 8px; }
    .composer-bubble .composer-actions button { background: #fff; border: 1px solid #e4e2dd; border-radius: 999px; color: #4a4740; font-size: 12px; font-weight: 700; min-height: 36px; padding: 6px 15px; white-space: nowrap; }
    .composer-bubble .composer-actions button:hover:not(:disabled) { background: #faf9f7; border-color: #cfcbc2; color: #1c1b19; }
    .composer-bubble .composer-actions button:disabled { color: #b5b1a9; cursor: not-allowed; }
    /* Send is the one thing on the row that is not optional, so it is the one
       filled shape -- same dark circle-weight as the reference, kept as a pill
       because the button carries a text label. */
    .composer-bubble .composer-actions .primary-button,
    .composer-bubble .composer-actions .primary-button:hover:not(:disabled) { background: #171614; border-color: #171614; color: #fff; font-size: 12px; min-height: 36px; padding: 6px 18px; }
    .composer-bubble .composer-actions .primary-button:disabled { background: #d9d6d0; border-color: #d9d6d0; color: #fbfaf8; }

    /* Icon-only affordance ("…"), drawn as one of the round toolbar buttons. */
    .composer-bubble .composer-help,
    .composer-help.nv2-details { background: #fff; border: 1px solid #e4e2dd; border-radius: 50%; color: #6f6b64; height: 30px; width: 30px; }
    .composer-help.nv2-details { font-size: 14px; height: 30px; letter-spacing: 0; padding-bottom: 6px; width: 30px; }
    .composer-bubble .composer-help:hover { background: #faf9f7; border-color: #cfcbc2; color: #1c1b19; }
    .composer-bubble .composer-help-text { background: #fff; border: 1px solid #e4e2dd; border-radius: 14px; box-shadow: 0 14px 34px rgba(28, 27, 25, .12); color: #33312d; font-weight: 600; padding: 12px 14px; }
    .composer-help-text { max-width: min(340px, calc(100vw - 48px)); }

    /* --- negotiatev2 composer -------------------------------------------- *
       Three rows and nothing else: status, the three selects, the toolbar.
       What the draft resolves to goes in the toolbar's summary column, which
       the layout already reserves, so it costs no height; the framing prose and
       the per-criterion breakdown live in the "…" popover. */
    .composer-bubble.negotiate-v2-composer { padding: 12px 16px 10px; }
    .negotiate-v2-composer .composer-title { font-size: 13px; font-weight: 700; gap: 8px; margin-bottom: 8px; min-height: 26px; }
    .composer-help.nv2-details { font-size: 13px; height: 26px; padding-bottom: 5px; width: 26px; }
    .negotiate-v2-composer .nv2-status { align-items: center; color: #57544e; display: inline-flex; flex-wrap: wrap; gap: 7px; min-width: 0; }
    .composer-bubble.negotiate-v2-composer .response-config { gap: 9px; margin-bottom: 0; }
    .composer-bubble.negotiate-v2-composer .response-field label { font-size: 12px; }
    .composer-bubble.negotiate-v2-composer .response-field select { min-height: 30px; }
    .composer-bubble.negotiate-v2-composer .composer-send-row { margin-top: 10px; padding-top: 9px; }
    .composer-bubble.negotiate-v2-composer .composer-actions button,
    .composer-bubble.negotiate-v2-composer .composer-actions .primary-button { min-height: 32px; }
    /* Two lines at most: the full sentence is on the element's title. */
    .nv2-offer-summary { -webkit-box-orient: vertical; -webkit-line-clamp: 2; line-clamp: 2; display: -webkit-box; overflow: hidden; }
    .nv2-offer-summary strong { color: #1c1b19; font-weight: 750; }
    /* Only the closed-state card uses this element here, and it carries the
       result text; the v1 composers keep it hidden. */
    .negotiate-v2-composer .response-preview { display: block; }

    /* The popover opens upward, into the history area: the composer is pinned
       to the bottom of a chat window with overflow:hidden, so a downward
       popover was being clipped off. */
    .composer-help.nv2-details .composer-help-text {
      bottom: calc(100% + 9px); left: auto; right: -7px; top: auto;
      max-height: 340px; max-width: min(360px, calc(100vw - 48px)); min-width: 300px;
      overflow-y: auto; width: max-content;
    }
    .nv2-details .nv2-details-title { color: #86827a; font-size: 10px; font-weight: 800; letter-spacing: .06em; margin: 0 0 7px; text-transform: uppercase; }
    /* One package line per row -- role on the left, what moves on the right --
       instead of the three side-by-side columns the wide layout uses, which in
       a popover left every value ellipsised down to nothing. */
    .nv2-details .response-package { background: #faf9f7; border: 1px solid #eceae5; border-radius: 10px; display: block; margin-top: 0; padding: 0 11px; }
    .nv2-details .response-package-row { border-top: 1px solid #eceae5; column-gap: 11px; display: grid; grid-template-columns: 88px minmax(0, 1fr); min-height: 0; padding: 8px 0; }
    .nv2-details .response-package-row:first-child { border-top: 0; }
    .nv2-details .response-package-role { align-self: center; color: #8b877f; font-size: 10px; font-weight: 700; grid-area: 1 / 1 / 3 / 2; letter-spacing: .01em; text-transform: none; }
    .nv2-details .response-package-issue { color: #1c1b19; font-size: 12px; font-weight: 700; grid-area: 1 / 2 / 2 / 3; overflow: visible; white-space: normal; }
    .nv2-details .response-package-value { color: #57544e; font-size: 11px; font-weight: 600; grid-area: 2 / 2 / 3 / 3; line-height: 1.4; text-align: left; white-space: normal; }
    .nv2-details .nv2-details-note { border-top: 1px solid #eceae5; color: #86827a; font-size: 11px; font-weight: 600; line-height: 1.5; margin-top: 11px; padding-top: 9px; }
    .nv2-details .nv2-details-note p { margin: 0; }
    .nv2-details .nv2-details-note p + p { margin-top: 7px; }
    @media (max-width: 900px) { .response-act-grid, .opening-act-grid, .response-config, .response-package { grid-template-columns: 1fr; } .response-package-row { grid-template-columns: 64px minmax(0, 1fr); } .response-package-value { grid-column: 2; text-align: left; } }
    @media (max-width: 900px) { .foresight-card { grid-template-columns: 1fr; } .foresight-offer { text-align: left; } }
    .reliability-cell strong { color: var(--green); font-size: 18px; }
    .details-header { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 10px; }
    .details-header h2 { margin: 0; }
    .hidden { display: none; }
    .summary-card, .group-card, .trace-step {
      border: 1.5px solid var(--line);
      border-radius: 16px;
      background: rgba(255, 253, 249, .64);
      padding: 12px;
      min-width: 0;
    }
    .summary-title, .group-title {
      display: flex;
      gap: 10px;
      justify-content: space-between;
      align-items: baseline;
      margin-bottom: 10px;
      font-weight: 800;
    }
    .summary-title span:last-child, .group-title span:last-child { color: var(--muted); font-size: 12px; font-weight: 700; }
    .metric-section { color: var(--muted); font-size: 11px; font-weight: 850; letter-spacing: 0; margin-top: 12px; text-transform: none; }
    .metric-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 8px; }
    .metric { border-top: 1px solid var(--soft-line); padding-top: 8px; min-width: 0; }
    .metric strong { display: block; font-size: 16px; font-variant-numeric: tabular-nums; }
    .metric span { color: var(--muted); display: block; font-size: 10px; font-weight: 800; letter-spacing: 0; margin-top: 2px; overflow-wrap: anywhere; text-transform: none; }
    .bar-track { height: 10px; background: #e7decf; border-radius: 999px; overflow: hidden; width: 100%; }
    .bar { height: 100%; border-radius: 999px; }
    .bar.class-0 { background: var(--blue); }
    .bar.class-1 { background: var(--orange); }
    .bar.reliability-bar { background: var(--green); }
    .trace-grid { align-items: stretch; display: grid; gap: 14px; grid-template-columns: 1fr; height: 100%; min-height: 0; }
    .trace-step { min-height: 0; }
    .step-title { color: var(--muted); font-size: 12px; font-weight: 850; letter-spacing: 0; margin-bottom: 10px; text-transform: none; }
    .persona-card { border: 1px solid var(--line); border-radius: 8px; background: #fbfcfd; padding: 10px; margin-bottom: 10px; }
    .persona-header { display: flex; align-items: start; justify-content: space-between; gap: 10px; margin-bottom: 8px; }
    .persona-kicker { color: var(--muted); font-size: 10px; font-weight: 850; letter-spacing: 0; text-transform: none; }
    .persona-name { font-size: 15px; font-weight: 850; line-height: 1.25; margin-top: 2px; }
    .persona-role { color: var(--muted); font-size: 12px; line-height: 1.35; margin-top: 2px; }
    .persona-grid { display: grid; gap: 7px; margin-top: 8px; }
    .persona-field { border-top: 1px solid var(--soft-line); padding-top: 7px; }
    .persona-field span { display: block; color: var(--muted); font-size: 10px; font-weight: 850; letter-spacing: 0; text-transform: none; }
    .persona-field strong { display: block; font-size: 12px; line-height: 1.35; margin-top: 2px; }
    .persona-actions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 9px; }
    .sliders { display: grid; gap: 9px; }
    .slider-row { display: grid; grid-template-columns: 128px 1fr 46px; gap: 8px; align-items: center; font-size: 13px; }
    .slider-row span:last-child { color: var(--muted); font-variant-numeric: tabular-nums; text-align: right; }
    .proxy-moves { display: grid; gap: 4px; margin-top: 8px; }
    .history { align-content: start; display: grid; flex: 1 1 auto; gap: 8px; grid-template-rows: 1fr; min-height: 0; overflow: auto; padding-right: 2px; }
    .history::before { content: ""; }
    .history-item { border-radius: 12px; padding: 9px 10px; font-size: 12px; line-height: 1.35; max-width: 92%; }
    .history-item.proxy.actionable { background: var(--proxy-bg); border-color: var(--proxy-border); color: #2d271f; }
    .history-item.proxy .primary-button { background: var(--proxy); border-color: var(--proxy); color: #fff; }
    .history-item.proxy .primary-button:hover { background: var(--proxy); border-color: var(--proxy); color: #fff; }
    .history-actions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }
    .history-item.user { justify-self: end; background: #eaf1f6; border: 1px solid #c7d7e4; }
    .history-item.proxy { justify-self: start; background: var(--proxy-bg); border: 1px solid var(--proxy-border); }
    /* negotiatev2 reads as a dialog: Self (my side) on the left, Other-party on the right */
    body.condition-negotiatev2 .history-item.user { justify-self: start; }
    body.condition-negotiatev2 .history-item.proxy { justify-self: end; }
    /* System notes are asides, not turns: no bubble, just centred grey text. */
    .history-item.system { background: transparent; border: 0; color: var(--muted); justify-self: center; max-width: 96%; padding: 2px 8px; text-align: center; }
    .history-item.system .history-title { color: var(--muted); font-weight: 850; }
    .history-item.thinking { justify-self: start; background: var(--proxy-bg); border: 1px dashed var(--proxy-border); color: var(--muted); }
    .thinking-dots::after { content: ""; animation: dots 1.2s steps(4, end) infinite; }
    @keyframes dots { 0% { content: ""; } 25% { content: "."; } 50% { content: ".."; } 75%, 100% { content: "..."; } }
    .history-title { font-weight: 850; margin-bottom: 3px; }
    .history-weights { color: var(--muted); font-variant-numeric: tabular-nums; }
    .history-offer { border-radius: 8px; margin: 4px 0; padding: 4px 8px; font-weight: 600; }
    .history-offer-self { background: #eaf1f6; border: 1px solid #c7d7e4; color: #223; }
    .history-offer-other { background: var(--proxy-bg); border: 1px solid var(--proxy-border); color: #2d271f; }
    .group-card { background: rgba(255, 253, 249, .74); }
    .group-card.winner { border-color: var(--brown); box-shadow: 0 0 0 2px rgba(73, 53, 29, .12); }
    .reliability { display: flex; align-items: baseline; gap: 8px; margin: 8px 0 10px; }
    .reliability strong { font-size: 28px; }
    .reliability span { color: var(--muted); font-size: 12px; font-weight: 700; }
    .criteria-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; margin-top: 10px; }
    .criterion { border-top: 1px solid var(--soft-line); padding-top: 7px; min-width: 0; }
    .criterion strong { display: block; font-size: 15px; font-variant-numeric: tabular-nums; }
    .criterion span { color: var(--muted); display: block; font-size: 10px; font-weight: 800; letter-spacing: 0; margin-top: 2px; overflow-wrap: anywhere; text-transform: none; }
    .contributor { color: var(--muted); font-size: 12px; line-height: 1.35; margin-top: 10px; }
    .consensus-hint { border: 1.5px solid var(--line); border-left: 4px solid var(--green); border-radius: 16px; background: rgba(255, 253, 249, .64); margin-top: 12px; padding: 12px 14px; }
    .final-decision-panel { display: grid; gap: 10px; margin-top: 0; padding: 14px; }
    .final-decision-status-banner { border: 1.5px solid #d8cfbf; border-left: 5px solid var(--green); border-radius: 8px; color: var(--ink); font-size: 14px; font-weight: 750; line-height: 1.25; padding: 7px 9px; }
    .final-decision-status-banner.conflict { border-left-color: var(--red); }
    .final-decision-status-banner strong { font-weight: 950; }
    .final-decision-header { align-items: center; display: flex; gap: 10px; justify-content: space-between; }
    .final-decision-header h2 { font-size: 16px; margin: 0; }
    .final-decision-next { background: var(--brown); border-color: var(--brown); border-radius: 999px; color: #fff; font-size: 18px; padding: 6px 11px; white-space: nowrap; }
    .final-decision-next:hover { background: var(--brown); color: #fff; }
    .final-decision-next:disabled { background: #b8b0a5; border-color: #b8b0a5; color: #fff; cursor: not-allowed; }
    .final-decision-options { display: grid; gap: 10px; grid-template-columns: repeat(auto-fit, 200px); justify-content: center; }
    .final-decision-option { align-items: center; background: rgba(255, 253, 249, .58); border: 1.5px solid #d8cfbf; border-radius: 10px; cursor: pointer; display: flex; gap: 8px; justify-content: center; min-height: 36px; padding: 6px 9px; font-size: 18px; font-weight: 850; width: 200px; }
    .final-decision-option input { appearance: none; background: rgba(255, 253, 249, .9); border: 2px solid #d8cfbf; border-radius: 50%; height: 18px; margin: 0; width: 18px; }
    .final-decision-option:has(input:checked) { background: #49351d; border-color: #49351d; color: #fff; }
    .final-decision-option input:checked { background: #2fb8b4; box-shadow: inset 0 0 0 4px rgba(255, 253, 249, .95); }
    .consensus-hint.disagreement { border-left-color: var(--red); }
    .decision-label { color: var(--green); font-size: 14px; font-weight: 850; line-height: 1.2; margin-bottom: 4px; overflow-wrap: anywhere; }
    .decision-label.disagreement { color: var(--red); }
    .decision-reason { color: var(--muted); font-size: 12px; line-height: 1.35; }
    table { width: 100%; border-collapse: collapse; font-size: 13px; }
    th, td { padding: 9px 8px; border-bottom: 1px solid var(--soft-line); text-align: right; white-space: nowrap; }
    th:first-child, td:first-child { text-align: left; }
    th { color: var(--muted); font-size: 12px; font-weight: 750; background: #f3ecdf; position: sticky; top: 0; z-index: 1; }
    .table-wrap { max-height: 560px; overflow: auto; border: 1.5px solid var(--line); border-radius: 16px; }
    .badge { display: inline-flex; align-items: center; min-width: 72px; justify-content: center; border-radius: 999px; padding: 3px 8px; color: #fff; font-size: 12px; font-weight: 750; }
    .badge.class-0 { background: var(--blue); }
    .badge.class-1 { background: var(--orange); }
    .status { color: var(--muted); font-size: 14px; padding: 18px 0; }
    @media (max-width: 1180px) {
      body.reconcile-mode main { width: min(1200px, calc(100vw - 56px)); }
      .toolbar, .grid, .trace-grid, .summary-cards, .group-cards, .wizard-body { grid-template-columns: 1fr; }
      body.condition-negotiation .grid, body.condition-negotiatev2 .grid { grid-template-columns: 1fr; }
      body.condition-negotiation .chat-window, body.condition-negotiatev2 .chat-window { max-height: none; min-height: 520px; }
      .criteria-grid, .metric-grid, .single-model-metrics { grid-template-columns: repeat(2, 1fr); }
      .hint { padding-top: 4px; }
    }
    @media (max-width: 720px) {
      main, body.reconcile-mode main { width: min(100vw - 28px, 1500px); margin-top: 18px; }
      .wizard-panel.persona-mode, .wizard-panel.elicitation-mode { padding: 28px 18px 34px; }
      .persona-intro { gap: 24px; }
      .persona-reading-card, .persona-consent-card { border-radius: 18px; }
      .persona-meta-row { align-items: flex-start; flex-direction: column; gap: 12px; font-size: 16px; }
      .persona-consent-row { grid-template-columns: 32px 1fr; gap: 14px; }
      .persona-consent-row input { border-radius: 7px; height: 28px; width: 28px; }
      .persona-begin-button { min-height: 64px; }
      .ranking-layout, .pair-cards { grid-template-columns: 1fr; }
      .pair-versus { text-align: center; }
      .pairwise-nav { font-size: 16px; }
      .ranking-row { grid-template-columns: 32px 1fr; }
      .ranking-controls { grid-column: 2; }
    }
  </style>
</head>
<body>
  <div class="condition-switcher" id="conditionSwitcher">
    <label for="conditionSelect">Condition</label>
    <select id="conditionSelect"></select>
  </div>
  <main>
    <!-- <h1>Negotiated Rashomon Reconciliation</h1> -->
    <section class="toolbar hidden" id="topToolbar">
      <div>
        <label for="datasetSelect">Dataset</label>
        <select id="datasetSelect"></select>
      </div>
      <div>
        <label for="caseSelect">Case Index</label>
        <select id="caseSelect"></select>
      </div>
      <div class="hint" id="datasetHint">Loading datasets...</div>
    </section>

    <section class="reconciliation-shell hidden" id="reconciliationGrid">
      <div class="reconcile-hero">
        <!-- <h1 class="reconcile-title">Negotiate a shared decision rule</h1> -->
        <!-- <p class="reconcile-subtitle">Review how each prediction group performs, adjust your criteria weights, and exchange offers with the proxy until both sides agree on the most reliable group.</p> -->
      </div>

      <div class="grid">
        <section class="left-stack">
          <div class="reconcile-identity-banner hidden" id="reconcileIdentityBanner"></div>
          <div class="panel case-prediction-panel">
            <section class="case-section">
              <div class="features" id="features"></div>
            </section>

            <section class="prediction-section">
              <div class="prediction-header">
                <h2>Prediction Reliability</h2>
                <div class="details-popover">
                  <button id="toggleDetailsButton" type="button" class="details-trigger">Model details</button>
                  <div class="table-wrap" id="modelDetailsWrap">
                    <table>
                      <thead>
                        <tr>
                          <th>Model</th>
                          <th>Predicted class</th>
                          <th>P(class 1)</th>
                          <th>Local consistency</th>
                          <th>Race check</th>
                          <th>Gender check</th>
                          <th>Sensitive check</th>
                          <th>Local TPR (k=30)</th>
                          <th>Local TNR (k=30)</th>
                        </tr>
                      </thead>
                      <tbody id="modelRows">
                        <tr><td colspan="10" class="status">Loading...</td></tr>
                      </tbody>
                    </table>
                  </div>
                </div>
              </div>
              <div class="summary-table-wrap" id="summaryTableWrap"></div>
              <div class="consensus-hint" id="consensusHint">
                <div class="decision-label" id="decisionLabel">-</div>
                <div class="decision-reason" id="decisionReason">Loading...</div>
              </div>

            </section>
          </div>

          <section class="panel final-decision-panel">
            <div class="final-decision-status-banner hidden" id="finalDecisionStatusBanner"></div>
            <div class="final-decision-header">
              <h2>Your final decision</h2>
              <button id="nextCaseButton" type="button" class="final-decision-next" disabled>Next case</button>
            </div>
            <div class="final-decision-options" id="finalDecisionOptions"></div>
          </section>
        </section>

        <section class="panel negotiation-panel">
   
          <p class="panel-note"></p>
          <div class="trace-grid">
            <div class="trace-step">
              <div class="chat-window">
                <div class="history" id="negotiationHistory"></div>
                <div class="composer" id="offerComposer"></div>
              </div>
            </div>
          </div>
        </section>
      </div>
    </section>
  </main>

  <script src="js/config-state.js?v=20260729-external-elicitation"></script>
  <script src="js/utils-salience.js?v=20260729-external-elicitation"></script>
  <script src="js/case-features.js?v=20260729-external-elicitation"></script>
  <script src="js/persona-persistence.js?v=20260729-external-elicitation"></script>
  <script src="js/profiles-stakes.js?v=20260729-external-elicitation"></script>
  <script src="js/elicitation.js?v=20260729-external-elicitation"></script>
  <script src="js/negotiation-ui.js?v=20260729-external-elicitation"></script>
  <script src="js/summary-guards.js?v=20260729-external-elicitation"></script>
  <script src="js/negotiation-engine.js?v=20260729-external-elicitation"></script>
  <script src="js/chat-decision.js?v=20260729-external-elicitation"></script>
  <script src="js/main.js?v=20260729-external-elicitation"></script>
</body>
</html>
